<meta charset="utf-8">

<title>PokéDestino · Randomlocke de Kanto</title>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* PokéDestino — one visual system on top of Añil's assets.
   Layout: sticky header; scenes fill the viewport with a dialog strip at the bottom; battles use a
   512×384 stage with commands underneath; menus are framed windows (Añil "choice" frame, 9-slice). */
@font-face { font-family: AnilPixel; src: url('assets/anil/pixel.ttf') format('truetype'); font-display: swap; }
:root {
  color-scheme: light;
  --ink: #14263f; --ink2: #2c3f5c; --paper: #fff4d6; --paper2: #f3e3b6; --line: #c9b37e; --muted: #5d6a78;
  --accent: #50d5cb; --accent-ink: #0e5f5a; --hp: #24ce70; --hp-mid: #f2b90f; --hp-low: #ef3e2c; --red: #d8432f; --gold: #f2b90f;
  --bg: #0f1d33; --bg2: #16294a;
  --navy0: #08111f; --navy: #0e1b31; --navy2: #13243f; --navy3: #1d3558; --frame: #4b79c4; --line2: #5b7fb3; --cream: #fbf1d4; --cream-line: #e3d09e;
  /* pixel outline: four offset shadows leave the corners open, like a drawn 9-slice */
  --pxb: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
  --pxb2: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink);
  --font: AnilPixel, "Courier New", monospace;
  --s: 18px; --r: 4px; --top: 58px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg) radial-gradient(circle at 50% -20%, var(--bg2), var(--bg) 70%) fixed; color: var(--ink); font: var(--s)/1.35 var(--font); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); padding-block: 0; -webkit-font-smoothing: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-weight: 400; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 { font-size: 2.2rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
img, .spr, .ico, .iico, .frames, .actor i, .layer { image-rendering: pixelated; }
.small { font-size: .82rem; } .muted { color: var(--muted); } .num { font-variant-numeric: tabular-nums; }
.label { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.tight { gap: 4px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.spacer { flex: 1; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* windows: Añil frame, paper inside */
.panel { border: 10px solid transparent; border-image: url('assets/ui/frame.png') 10 / 10px stretch; background: var(--paper); background-clip: padding-box; padding: 12px 14px; border-radius: 0; }
.dialog { border: 12px solid transparent; border-image: url('assets/ui/speech.png') 12 fill / 12px stretch; color: #fff; padding: 6px 10px; text-shadow: 1px 1px 0 #000a; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 6px 18px; border: 3px solid var(--ink); border-radius: 0; background: var(--paper); box-shadow: inset 0 -4px 0 var(--paper2), 0 3px 0 var(--ink); cursor: pointer; transition: transform .06s; }
.btn:hover { background: #fff; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--paper2), 0 1px 0 var(--ink); }
.btn.primary { background: var(--navy2); color: var(--cream); border-color: var(--accent); box-shadow: 0 0 0 2px var(--navy0), 0 3px 0 2px var(--navy0); }
.btn.primary::before { content: ""; border: 5px solid transparent; border-left: 7px solid var(--cream); border-right: 0; }
.btn.primary:hover { background: var(--navy3); }
.btn.ghost { background: transparent; border-color: var(--ink2); box-shadow: none; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.sm { min-height: 34px; padding: 2px 10px; font-size: .9rem; box-shadow: 0 2px 0 var(--ink); }
.btn.big { min-height: 52px; font-size: 1.15rem; width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; transform: none; }
.btn small { font-size: .7rem; opacity: .75; }
.icon-btn { min-width: 40px; min-height: 40px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--paper); cursor: pointer; font-size: 1rem; }
.pill { display: inline-flex; align-items: center; min-height: 34px; padding: 0 10px; border: 3px solid var(--ink); border-radius: var(--r); background: var(--paper); }
button.pill { cursor: pointer; } button.pill.vial { background: #d9f6f3; } button.pill[disabled] { opacity: .5; cursor: not-allowed; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; min-height: var(--top); background: var(--paper); border-bottom: 4px solid var(--ink); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.top .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 6px; font-size: 1.3rem; }
.logo-mini { width: 40px; height: 40px; overflow: hidden; display: inline-block; }
.party-mini { display: flex; gap: 2px; cursor: pointer; }
.pm { position: relative; width: 40px; height: 34px; background: var(--paper2); border: 2px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.pm .ico { margin-top: -4px; } .pm i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--hp); } .pm i.mid { background: var(--hp-mid); } .pm i.low { background: var(--hp-low); }
.pm.empty { opacity: .45; }
#app { max-width: 1400px; margin: 0 auto; }

/* sprites & icons */
.ico { display: inline-block; width: 40px; height: 30px; background-image: url('assets/pokemonicons-sheet.png'); background-repeat: no-repeat; flex: none; }
.spr { display: inline-block; background-repeat: no-repeat; flex: none; }
.spr.front { background-image: url('assets/front-sheet.png'); } .spr.back { background-image: url('assets/back-sheet.png'); }
.iico { display: inline-block; width: 24px; height: 24px; background-image: url('assets/itemicons-sheet.png'); background-repeat: no-repeat; flex: none; }
.ic-key { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff 0 22%, var(--accent) 23% 60%, var(--accent-ink) 61%); flex: none; }
.frames { display: block; width: calc(var(--h) * var(--s)); height: calc(var(--h) * var(--s)); background-repeat: no-repeat; background-size: calc(var(--w) * var(--s)) calc(var(--h) * var(--s)); animation: strip var(--dur) steps(var(--n)) infinite; }
@keyframes strip { to { background-position-x: calc(var(--w) * var(--s) * -1); } }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; padding: 0 6px; border: 2px solid var(--ink); border-radius: 3px; background: #fff; white-space: nowrap; }
.chip.type { color: #fff; border-color: #0005; text-shadow: 1px 1px 0 #0006; text-transform: uppercase; }
.chip.st { color: #fff; border: 0; } .st-brn { background: #e2622b; } .st-par { background: #c9a400; } .st-slp { background: #7d7d8f; } .st-frz { background: #4fb3d9; } .st-psn, .st-tox { background: #9a4bb2; }
.hpbar { height: 6px; background: #3b4766; border: 1px solid var(--ink); } .hpbar > i { display: block; height: 100%; background: var(--hp); transition: width .45s; } .hpbar.mid > i { background: var(--hp-mid); } .hpbar.low > i { background: var(--hp-low); }
.movechips { display: flex; gap: 4px; flex-wrap: wrap; }
.tdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0006; flex: none; }

/* ===== screens: one framed panel per screen (exploration, battle) ===== */
body:has(#app > .screen) .top { display: none; }
body:has(#app > .screen) #app { max-width: 1400px; padding: 10px; }
.screen { position: relative; height: calc(100dvh - 20px); min-height: 440px; overflow: hidden; background: var(--navy); border: 3px solid var(--frame); box-shadow: 0 0 0 3px var(--navy0), inset 0 0 0 2px var(--navy0); }

/* ===== adventure scene ===== */
.adv { background: #000; }
.viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
.viewport:active { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.layer { position: absolute; left: 0; top: 0; pointer-events: none; user-select: none; }
.layer.over { z-index: 200; }
.actors { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
.actor { position: absolute; transition: left .25s, top .25s; }
.actor i { display: block; }
.actor.follower i, .actor.walking i { animation: walk4 .6s steps(4) infinite; }
@keyframes walk4 { to { background-position-x: calc(var(--fw, 64px) * -4); } }
.pois { position: absolute; inset: 0; z-index: 300; }
.poi { position: absolute; width: 32px; height: 32px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; }
.poi::before { content: ''; position: absolute; inset: -6px; border: 3px solid transparent; }
.poi:hover::before, .poi:focus-visible::before, .poi.hl::before { border-color: var(--accent); box-shadow: 0 0 0 2px var(--ink); }
.poi .mark { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); min-width: 22px; height: 22px; padding: 0 4px; display: grid; place-items: center; background: var(--cream); box-shadow: var(--pxb2); font-size: 14px; line-height: 1; color: var(--ink); animation: bob 1.2s ease-in-out infinite; }
.poi.k-trainer .mark, .poi.k-rival .mark, .poi.k-leader .mark { background: #ffe0dc; color: var(--red); }
.poi.k-go .mark { background: #d9f6f3; }
.poi.st-done .mark { animation: none; background: var(--paper2); color: var(--muted); }
.poi.st-blocked { opacity: .5; } .poi.st-blocked .mark { animation: none; } .poi.st-locked .mark { animation: none; background: #ddd; }
.poi .tag { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); white-space: nowrap; padding: 2px 8px; background: var(--navy2); color: var(--cream); box-shadow: 0 0 0 2px var(--accent); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .12s; }
.poi:hover .tag, .poi:focus-visible .tag, .poi.hl .tag { opacity: 1; }
@keyframes bob { 50% { transform: translate(-50%, -3px); } }
/* HUD over the scene: place top-left, party / money / menu top-right */
.hud-loc { position: absolute; left: 14px; top: 14px; z-index: 20; display: flex; gap: 10px; align-items: baseline; min-height: 40px; padding: 6px 14px; background: var(--cream); color: var(--ink); box-shadow: var(--pxb), inset 0 0 0 2px #fff8; font-size: 1.15rem; }
.hud-loc span { font-size: .75rem; color: var(--muted); }
.hud { position: absolute; right: 14px; top: 14px; z-index: 20; display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; max-width: calc(100% - 260px); }
.hud .party-mini { display: flex; gap: 6px; cursor: pointer; }
.pm { position: relative; width: 42px; height: 40px; display: grid; place-items: center; overflow: hidden; background: var(--navy2); box-shadow: 0 0 0 2px var(--line2), inset 0 0 0 2px var(--navy0); }
.pm.lead { box-shadow: 0 0 0 2px var(--accent), inset 0 0 0 2px var(--navy0); }
.pm .ico { margin-top: -4px; } .pm i { position: absolute; left: 3px; bottom: 3px; height: 3px; max-width: calc(100% - 6px); background: var(--hp); } .pm i.mid { background: var(--hp-mid); } .pm i.low { background: var(--hp-low); }
.pm.empty::after { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line2); background: linear-gradient(transparent 45%, var(--line2) 45% 55%, transparent 55%); opacity: .8; }
.hud-plate { display: flex; align-items: center; gap: 14px; min-height: 40px; padding: 0 14px; background: var(--cream); color: var(--ink); box-shadow: var(--pxb), inset 0 0 0 2px #fff8; }
.hud-plate .vial { border: 0; background: none; padding: 0; cursor: pointer; } .hud-plate .vial:hover:not([disabled]) { color: var(--accent-ink); text-decoration: underline; } .hud-plate .vial[disabled] { opacity: .5; cursor: not-allowed; }
.hud-btn { min-width: 40px; min-height: 40px; padding: 0 12px; border: 0; background: var(--cream); color: var(--ink); box-shadow: var(--pxb), inset 0 0 0 2px #fff8; cursor: pointer; }
.hud-btn:hover { background: #fff; }
/* dialog strip: text left, choices right */
.strip { position: absolute; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 16px; min-height: 76px; max-height: 46%; overflow: auto; padding: 12px 16px; background: var(--cream); color: var(--ink); box-shadow: var(--pxb), inset 0 0 0 3px #fff8, inset 0 0 0 5px var(--cream-line); }
.strip .say { flex: 1 1 260px; margin: 0; font-size: 1.3rem; min-height: 1.4em; }
.strip .say.muted { color: var(--ink2); }
.strip .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; max-width: 68%; }

/* ===== battle: stage on top, command strip in the same frame ===== */
.battle { display: flex; flex-direction: column; color: var(--cream); }
/* the stage keeps 16:9 at full width; on short, wide windows it is height-capped and the sides show the blurred background */
.battle.screen { height: auto; min-height: 0; }
.stagewrap { position: relative; flex: none; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100dvh - 20px - var(--bar-h, 150px)); min-height: 200px; overflow: hidden; background: #000; }
.stagewrap::before { content: ''; position: absolute; inset: -24px; background: var(--bb) center / cover; filter: blur(10px) brightness(.55); }
.stage { position: absolute; left: 0; top: 0; width: 512px; height: 288px; transform-origin: 0 0; overflow: hidden; }
.stage .bb { position: absolute; left: 0; top: -40px; width: 512px; height: 384px; }
.arena { position: absolute; inset: 0; }
.mon-sprite { position: absolute; display: grid; place-items: end center; }
.mon-sprite .spr { display: block; transform-origin: 50% 85%; }
.mon-sprite.hit .spr { animation: hitspr .42s steps(1); }
@keyframes hitspr { 0%, 40%, 80% { opacity: .15; transform: translateX(-4px); } 20%, 60% { opacity: 1; transform: translateX(4px); } 100% { opacity: 1; transform: none; } }
.mon-sprite.lunge-me .spr { animation: lungeMe .36s ease-out; } @keyframes lungeMe { 15% { transform: translate(-6px, 4px); } 45% { transform: translate(30px, -22px); } 100% { transform: none; } }
.mon-sprite.lunge-foe .spr { animation: lungeFoe .36s ease-out; } @keyframes lungeFoe { 15% { transform: translate(6px, -4px); } 45% { transform: translate(-30px, 20px); } 100% { transform: none; } }
.mon-sprite.fainting .spr { animation: faintspr .5s ease-in forwards; } @keyframes faintspr { to { transform: translateY(60px); opacity: 0; } }
.mon-sprite.sendout .spr { animation: sendout .45s ease-out; } @keyframes sendout { from { transform: scale(.1); filter: brightness(4); opacity: .2; } }
.mon-sprite.appear .spr { animation: appear .45s ease-out; } @keyframes appear { from { transform: translateX(60px); opacity: 0; } }
.mon-sprite.recall .spr { animation: recall .32s ease-in forwards; } @keyframes recall { to { transform: scale(.1); filter: brightness(4); opacity: 0; } }
/* databoxes: real-size HTML over the stage rectangle */
.dboxes { position: absolute; z-index: 5; pointer-events: none; }
.dbx { position: absolute; display: flex; flex-direction: column; gap: 10px; width: clamp(168px, 40%, 320px); }
.dbx.foe { left: 3%; top: 7%; } .dbx.me { right: 3%; bottom: 7%; }
.dbox { position: relative; padding: 7px 12px 8px; background: var(--cream); color: var(--ink); box-shadow: var(--pxb), inset 0 0 0 2px #fff8, 6px 6px 0 0 #0006; font-size: clamp(13px, 1.45vw, 19px); line-height: 1.2; }
.db-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.db-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.db-g { flex: none; } .db-g.M { color: #2f6fe0; } .db-g.F { color: #e0457b; }
.db-st { flex: none; padding: 0 5px; font-size: .7em; color: #fff; align-self: center; } .db-st.st-none { display: none; }
.db-lv { margin-left: auto; flex: none; }
.db-bar { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.db-ps { flex: none; padding: 0 5px; background: var(--ink); color: var(--gold); font-size: .62em; line-height: 1.5; }
.db-hp { flex: 1; height: 9px; padding: 2px; background: var(--ink2); box-shadow: 0 0 0 1px var(--ink); }
.db-hp i { display: block; height: 100%; background: var(--hp); transition: width .45s linear; } .db-hp i.mid { background: var(--hp-mid); } .db-hp i.low { background: var(--hp-low); }
.db-hpn { display: block; margin-top: 2px; text-align: right; }
.db-balls { position: absolute; right: 8px; top: -9px; display: flex; gap: 1px; }
.dbx.me .db-balls { left: 8px; right: auto; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.db-balls i { width: 13px; height: 13px; background: url('assets/ui/icon_ball.png') 0 0 / 13px 13px; } .db-balls i.off { background-image: url('assets/ui/icon_ball_faint.png'); }
.dbox.thin { padding: 4px 10px 5px; font-size: clamp(12px, 1.25vw, 16px); } .dbox.thin .db-hpn { font-size: .85em; margin-top: 0; }
.b-tag { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px; align-items: baseline; padding: 3px 12px; background: #0e1b31cc; box-shadow: 0 0 0 2px var(--line2); white-space: nowrap; font-size: .95rem; }
.b-tag span { color: var(--accent); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
.b-tools { position: absolute; right: 10px; top: 10px; z-index: 6; display: flex; gap: 8px; align-items: center; }
.b-tools .num { padding: 3px 10px; background: #0e1b31cc; box-shadow: 0 0 0 2px var(--line2); font-size: .85rem; }
.b-tools .num:empty { display: none; }
.b-tools .hud-btn { min-width: 36px; min-height: 36px; padding: 0 8px; }
.fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 500; overflow: hidden; }
.fx-orb { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: currentColor; box-shadow: 0 0 14px 6px currentColor; }
.fx-ring { position: absolute; left: 0; top: 0; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 5px solid currentColor; box-shadow: 0 0 12px currentColor; }
.fx-float { position: absolute; left: 0; top: 0; font: 22px var(--font); text-shadow: 1px 2px 0 #0008; white-space: nowrap; margin-left: -14px; }
.fx-ball { position: absolute; left: 0; top: 0; width: 32px; height: 64px; margin: -40px 0 0 -16px; background-repeat: no-repeat; background-position: 0 0; image-rendering: pixelated; }
/* command strip */
.b-ui { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.15fr); gap: 12px; padding: 12px; background: var(--navy); border-top: 3px solid var(--frame); box-shadow: inset 0 2px 0 var(--navy0); }
.b-msg { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 104px; margin: 3px; padding: 10px 18px; background: var(--cream); color: var(--ink); box-shadow: var(--pxb), inset 0 0 0 3px #fff8, inset 0 0 0 5px var(--cream-line); cursor: pointer; font-size: 1.25rem; line-height: 1.3; }
.blog p { display: none; margin: 0; } .blog p:last-child { display: block; }
.blog p:last-child::after { content: ' ▼'; color: var(--accent-ink); font-size: .65em; animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } }
.b-msg.asking .blog p:last-child { font-size: .72em; color: var(--muted); } .b-msg.asking .blog p:last-child::after { content: none; }
.b-q { margin: 0; } .b-q:empty { display: none; }
.b-ctl { min-height: 104px; display: flex; flex-direction: column; justify-content: center; }
.b-grid { display: grid; grid-template-columns: minmax(0, 1fr) clamp(132px, 24%, 200px); grid-template-areas: "moves cmds"; gap: 10px; align-items: stretch; }
.b-moves { grid-area: moves; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.b-team { grid-area: moves; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; max-height: 190px; overflow: auto; padding: 3px; }
.b-cmds { grid-area: cmds; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
.mv { display: flex; align-items: center; gap: 10px; min-height: 48px; margin: 2px; padding: 0 14px 0 20px; border: 0; background: linear-gradient(90deg, var(--tc) 0 6px, var(--navy2) 6px); color: var(--cream); box-shadow: 0 0 0 2px color-mix(in srgb, var(--tc) 65%, #fff); cursor: pointer; text-align: left; font-size: clamp(14px, 1.35vw, 19px); }
.mv:hover:not([disabled]), .mv:focus-visible { background: linear-gradient(90deg, var(--tc) 0 6px, var(--navy3) 6px); box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px var(--navy0); outline: none; }
.mv { flex-wrap: wrap; align-content: center; row-gap: 0; }
.mv b { flex: 1 1 auto; min-width: 0; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mv span { margin-left: auto; font-size: .78em; white-space: nowrap; color: #c9d6ea; }
.mv[disabled] { opacity: .45; cursor: not-allowed; }

/* Visual depth: paper windows, cartridge-like controls and distinct equipment screens. */
body { background-color:#091528; background-image:radial-gradient(ellipse at 50% 0,#264668 0,transparent 65%),repeating-linear-gradient(135deg,#ffffff03 0 1px,transparent 1px 8px); }

.modal { padding:14px 18px 18px; }

.btn.primary { background-image:linear-gradient(#30516a,#112b43); box-shadow:inset 0 2px #ffffff38,inset 0 -3px #07172b,0 0 0 2px var(--navy0),0 3px 0 2px var(--navy0); }

.card,.menu-btn { background:linear-gradient(120deg,#fffef6,#eee4c9); box-shadow:inset 0 2px #fff,0 3px #c5b487; border-color:#8d936f; }

/* Team: a dark roster beside a light dossier, with reserved empty slots. */
.modal-team,.modal-bag { background-color:#17374c; background-image:repeating-linear-gradient(135deg,#ffffff04 0 2px,transparent 2px 9px); border-image:none; border:3px solid #86a7b4; box-shadow:0 0 0 3px #0c1c31,inset 0 0 0 2px #0b263a,0 14px 40px #0007; padding:18px; }

.title-card { width:min(560px,100%); padding:22px 26px; gap:14px; border:3px solid #6e9baa; border-image:none; background:#10283e repeating-linear-gradient(135deg,#ffffff04 0 2px,transparent 2px 10px); color:#fdf2ce; box-shadow:0 0 0 4px #071a2c,inset 0 0 0 3px #23465e,0 18px 0 -8px #071827,0 28px 55px #0008; }

const TRADE_EVOLUTION_LEVEL = 36;
function evoMethod(e) {
  if(e.evoType==='trade')return {m:'level',lv:TRADE_EVOLUTION_LEVEL,note:'Intercambio sustituido por nivel; sin intercambio ni objeto.'};
  if(!e.evoType&&e.evoLevel)return {m:'level',lv:e.evoLevel,note:e.evoCondition?'La condición especial de horario, clima o entorno no se exige en esta aventura.':''};
  if(e.evoType==='useItem')return {m:'item',item:toID(e.evoItem||(e.id==='kleavor'?'Black Augurite':''))};
  if(e.evoType==='levelFriendship')return cfg().evoSimplify!==false?{m:'level',lv:22,note:'Amistad simplificada a nivel.'}:{m:'item',item:'linkingcord',note:'Amistad sustituida por Cordón Unión en esta aventura.'};
  return cfg().evoSimplify!==false?{m:'level',lv:e.evoLevel||30,note:'Método especial simplificado a nivel; no requiere movimiento, objeto equipado ni acciones externas.'}:{m:'item',item:'linkingcord',note:'Método especial sustituido por Cordón Unión en esta aventura.'};
}
function evolutionBlock(mon,e) {
  if(mon.hp===0||S?.dead?.some(m=>m.uid===mon.uid))return 'Un Pokémon caído no puede evolucionar.';
  if(toID(mon.item||'')==='everstone')return 'Quita la Piedra Eterna para evolucionar.';
  if(['M','F'].includes(e.gender)&&mon.gender!==e.gender)return e.gender==='M'?'Requiere un macho.':'Requiere una hembra.';
  if(['hitmonlee','hitmonchan','hitmontop'].includes(e.id)) {
    const st=calcStats(mon),ok=e.id==='hitmonlee'?st.atk>st.def:e.id==='hitmonchan'?st.atk<st.def:st.atk===st.def;
    if(!ok)return e.id==='hitmonlee'?'Requiere Ataque > Defensa.':e.id==='hitmonchan'?'Requiere Ataque < Defensa.':'Requiere Ataque = Defensa.';
  }
  return '';
}
function evolutionCandidates(mon,byItem=false) {
  return evosOf(D.species.get(mon.species)).filter(e=>{
    if(e.id==='shedinja'||evolutionBlock(mon,e))return false;
    const method=evoMethod(e);
    return byItem?method.m==='item'&&(byItem===true||method.item===byItem):method.m==='level'&&mon.level>=method.lv;
  });
}
function evolutionRequirement(e) {
  const m=evoMethod(e),parts=[m.m==='level'?'Nivel '+m.lv:'Usar '+itemName(m.item)];
  if(['M','F'].includes(e.gender))parts.push(e.gender==='M'?'macho':'hembra');
  if(e.id==='hitmonlee')parts.push('Ataque > Defensa');
  if(e.id==='hitmonchan')parts.push('Ataque < Defensa');
  if(e.id==='hitmontop')parts.push('Ataque = Defensa');
  return parts.join(' · ');

function syncCampaignRules() {
  for(const [id,pois]of Object.entries(CAMPAIGN_BASE_POIS))WORLD[id].pois=pois.map(p=>JSON.parse(JSON.stringify(p)));

  if(!newCampaign() || cfg().difficulty==='hard')return;

  }
  applyChapterPresentation();

}

    const m = await chooseMon(`¿Usar ${itemName(d.id)} en…?`); if (!m) return drawBag();

    addBag(d.id, -1); save(); toast(`PP restaurados a ${nameOf(m)}`); drawBag();

};

// Team ordering is a splice: dropping A on C moves A to C's place and shifts the others.
function movePartyMember(uid, index) {
  if (!S || B || TEAM.tab !== 'party') return false;
  const from = S.party.findIndex(m => m.uid === uid);
  if (from < 0 || index < 0) return false;
  const to = Math.min(index, S.party.length - 1);
  if (from === to) return false;
  const [mon] = S.party.splice(from, 1); S.party.splice(to, 0, mon);
  TEAM.sel = uid; save(); drawTeam(); renderTop();
  $('#modal [data-uid="' + uid + '"]')?.focus({preventScroll:true});
  return true;
}
function bindTeamOrdering() {
  const grid = $('#modal .team-grid');
  if (!grid || TEAM.tab !== 'party' || B) return;
  let drag = null, suppressClick = false;
  const clear = () => {
    if (!drag) return;
    const old = drag; drag = null;
    old.ghost?.remove(); old.source.classList.remove('is-dragging');
    grid.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));
    document.removeEventListener('keydown', cancelKey, true);
    if(old.source.hasPointerCapture(old.pointer))old.source.releasePointerCapture(old.pointer);
    if(old.active){suppressClick=true;setTimeout(()=>{suppressClick=false},0);}
    return old;
  };
  const cancelKey = e => { if(e.key==='Escape' && drag){ e.preventDefault();e.stopImmediatePropagation(); clear(); } };
  grid.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();}},true);

// ================= ADVENTURE =================
// One scene per node. The player clicks a point of interest (POI); the trainer walks there and the
// decision resolves. All results persist in S so a reload never changes species, rewards or outcomes.
const TILE = 32;
let SCENES = {}; // assets/scenes/scenes.json
const node = id => WORLD[id || S.at.node];
const poiKey = (n, p) => n + ':' + p;
const isDone = (n, p) => !!S.done[poiKey(n, p)];
function reqOk(n, p) {
  for (const r of p.requires || []) {
    if (typeof r === 'string') { if (!isDone(n, r)) return false; }
    else if (r.flag) { if (!S.flags[r.flag]) return false; }
    else if (r.done) { if (!S.done[r.done]) return false; }
    else if (r.visited) { if (!S.visited[r.visited]) return false; }
    else if (r.badge) { if (badges() < r.badge) return false; }
  }
  return true;
}
const REPEATABLE = ['go', 'heal', 'shop', 'pc', 'trade', 'locked'];
function poiState(n, p) {
  if (p.kind === 'grass') { const e = S.enc[n]; if (!e || e.state === 'pending') return reqOk(n, p) ? 'open' : 'blocked'; return 'done'; }
  if (!REPEATABLE.includes(p.kind) && isDone(n, p.id)) return 'done';
  if (p.kind === 'go' && !reqOk(n, p)) return p.locked ? 'locked' : 'blocked';
  return reqOk(n, p) ? 'open' : 'blocked';
}

// ---------- new game ----------
function tmRewardLevel(index) {
  const levels=[];
  for(const n of Object.values(WORLD))for(const p of n.pois)if(p.reward?.cat==='tm'&&p.reward.tm===index)levels.push(n.lv?.[1]||5);
  for(const leader of Object.values(LEADERS))if(leader.tm===index)levels.push(leader.cap);
  return levels.length?Math.min(...levels):5;
}
function buildTmPlan() {
  const rng = new Rng(S.cfg.seed, 'tmplan'); const used = new Set(); const plan = [];
  if (!S.cfg.tmRandom) return rng.shuffle(CLASSIC_TMS).slice(0, 50);
  for (let i = 0; i < 50; i++) {
    const capLv = newCampaign() ? tmRewardLevel(i) : CAPS[Math.min(8, Math.floor(i / 6))] + 8;

function rewardFor(id, p, salt = '') {

async function grantPoiReward(id, p, salt = '') {
  const key = poiKey(id, p.id + ':reward' + salt); if (S.done[key]) return S.done[key];

  await say(`Has conseguido: ${label}.`);
  return r.id;
}

// ---------- results, wipes, rescues ----------
function applyResults(res) {
  const league = inLeagueChallenge() ? beginLeagueAttempt() : null;
  const deaths = [];
  for (const r of res.mons) {
    const m = findMon(r.uid); if (!m) continue;
    m.hp = r.hp; m.status = r.status || ''; m.item = r.item || null; if (r.pp) m.pp = r.pp;
    if (r.fainted) deaths.push(m);
  }
  for (const m of deaths) {
    S.party = S.party.filter(x => x !== m); m.hp = 0;
    if (league) {
      if (!league.fainted.some(x => x.uid === m.uid)) league.fainted.push(m);
      logEvent(nameOf(m)+' se debilitó en la Liga. Puede volver con el Pokévial.');
    } else {
      m.cause = `${res.cause || 'Combate'} · ${node().name}`; S.dead.push(m); logEvent(`${nameOf(m)} cayó (${m.cause}).`);
    }
  }
  return deaths;
}
async function checkWipe() {
  if (S.party.length) return false;
  if (S.box.length) { S.party = S.box.splice(0, 6); save(); await info('Tu equipo ha caído', '<p>Sacas a los Pokémon de tu caja para seguir.</p>'); render(); return true; }
  const can = S.cfg.rescue && S.rescue.charges > 0 && S.dead.some(m => !S.rescue.revived.includes(m.uid));
  if (can) {
    const list = S.dead.filter(m => !S.rescue.revived.includes(m.uid));
    const uid = await choose('Segunda oportunidad', `<p>No te quedan Pokémon vivos. Puedes gastar una carga (${S.rescue.charges}) para revivir a uno. Cada Pokémon solo puede revivir una vez.</p>`, list.map(m => ({ v: m.uid, html: `<div class="row">${icon(m.species)}<b>${esc(nameOf(m))}</b><span class="small muted">Nv ${m.level}</span></div>` })), true);
    const m = S.dead.find(x => x.uid === uid); S.dead = S.dead.filter(x => x !== m);

    await info('¡Segunda oportunidad!', `<div class="row">${icon(m.species, 'x2')}<p><b>${esc(nameOf(m))}</b> vuelve a tu equipo.</p></div>`);
    if (S.lastCenter) return travel(S.lastCenter).then(() => true);

}
function deathList(deaths, temporary = false) { return deaths.length ? `<div class="deaths"><b>${temporary ? 'Debilitados en esta prueba' : 'Caídos para siempre'}</b><div class="row">${deaths.map(m => `<span class="row">${icon(m.species)}${esc(nameOf(m))}</span>`).join('')}</div></div>` : ''; }
async function processPending() {
  while (S.pending.length) {
    const p = S.pending.shift(); const m = findMon(p.uid); if (!m) continue;
    if (m.hp === 0 || S.dead.some(x=>x.uid===m.uid)) continue;
    if (p.t === 'evo') await doEvolution(m, false);
    else if (p.t === 'learn') await learnMove(m, randomMove(live, D.species.get(m.species), m.level, m.moves, false));
    else if (p.t === 'learnset') { const lm = (await levelMoves(D.species.get(m.species))).filter(x => x.lv >= p.from && x.lv <= p.to && !m.moves.includes(x.id)); for (const x of lm) await learnMove(m, x.id); }
    save();
  }
}
async function doEvolution(m, byItem, targetId = '', manual = false) {
  if(B || !findMon(m.uid) || m.hp===0) return false;
  const state=S,original=m.species,candidates=evolutionCandidates(m,byItem);

  if(targetId&&!to || !candidates.length || byItem&&typeof byItem==='string'&&!(S.bag[byItem]>0))return false;
  if(!to&&candidates.length>1){
    const pick=await choose('Elige la evolución de '+esc(nameOf(m)), '<p>Hay varias evoluciones válidas. Elige tú la rama.</p>',[...candidates.map(e=>({v:e.id,html:'<div class="row">'+icon(e.name)+'<b>'+esc(e.name)+'</b></div><span class="small muted">'+esc(evolutionRequirement(e))+'</span>'})),{v:'no',html:'<b>Ahora no</b>'}],true);
    if(!pick||pick==='no')return false;to=candidates.find(e=>e.id===pick);
  }
  to ||= candidates[0];
  if(!manual&&(byItem||S.cfg.evoAuto===false)){
    const ok=await choose('¡'+esc(nameOf(m))+' está evolucionando!', '<div class="row">'+icon(m.species,'x2')+'<span class="big">→</span>'+icon(to.name,'x2')+'</div><p>'+esc(evolutionRequirement(to))+'</p>',[{v:'yes',html:'<b>Dejar que evolucione</b>'},{v:'no',html:'<b>Pararlo</b><span class="small muted">Puedes intentarlo desde su ficha o al subir de nivel.</span>'}],true);
    if(ok!=='yes')return false;
  }
  if(S!==state||B||!findMon(m.uid)||m.species!==original||!evolutionCandidates(m,byItem).some(e=>e.id===to.id))return false;
  if(byItem&&typeof byItem==='string'){if(!(S.bag[byItem]>0))return false;addBag(byItem,-1);}
  const oldAb = m.ability; const prevName = nameOf(m); const prevSpecies = m.species;
  m.species = to.name; if (m.hp != null) m.hp = clamp(m.hp, 1, hpMax(m));
  if (S.cfg.abilityRandom && S.cfg.abilityOnEvo === 'reroll') m.ability = randomAbility(live, to);
  else if (!S.cfg.abilityRandom) { const abs = Object.values(to.abilities); const prev = Object.values(D.species.get(to.prevo).abilities); m.ability = abs[prev.indexOf(oldAb)] || abs[0]; }
  const fam = familyOf(to); if (!S.caught.includes(fam)) S.caught.push(fam); if (!S.obtained.includes(to.name)) S.obtained.push(to.name);
  logEvent(`${prevName} evolucionó a ${to.name}.`);
  const followups=[];
  if(S.cfg.movesRandom&&S.cfg.movesOnLevel)followups.push({t:'learn',uid:m.uid});
  else if(!S.cfg.movesRandom)followups.push({t:'learnset',uid:m.uid,from:m.level,to:m.level});
  if(evolveTarget(m,false))followups.push({t:'evo',uid:m.uid});
  S.pending.unshift(...followups);save();
  const notice=info('¡Enhorabuena!', `<div class="evolution-stage" aria-label="Evolución completada"><div class="evolution-before">${icon(prevSpecies,'x2')}</div><span class="evolution-flash" aria-hidden="true"></span><div class="evolution-after">${icon(m.species,'x2')}</div></div><p class="evolution-result">¡${esc(prevName)} ha evolucionado a <b>${esc(to.name)}</b>!</p>${oldAb !== m.ability ? `<p>Su habilidad cambia: ${esc(abilityName(oldAb))} → <b>${esc(abilityName(m.ability))}</b></p>` : ''}`);
  const stage=$('.evolution-stage');
  // Presentation only: the new species and follow-up queue were saved above.
  for(const [selector,species] of [['.evolution-before',prevSpecies],['.evolution-after',m.species]]) {
    spriteUrl(species,m.shiny?'fs':'f').then(r=>{
      const box=stage?.querySelector(selector);if(!r||!stage.isConnected||!box)return;
      const scale=Math.min(2,144/r.h);
      box.innerHTML=`<i aria-hidden="true" style="display:block;width:${r.h*scale}px;height:${r.h*scale}px;background-image:url('${r.url}');background-size:${r.w*scale}px ${r.h*scale}px"></i>`;
    });
  }
  await notice;
  return true;
}
// learning keeps a PP bank per move so swapping never refills PP (spec §9)
function setMoveAt(m, i, mid) {
  m.pp ||= m.moves.map(() => null); m.ppBank ||= {};
  if (i < m.moves.length) { const old = m.moves[i]; m.ppBank[old] = m.pp[i] ?? maxPP(old); }
  const pp = m.ppBank[mid] ?? null; delete m.ppBank[mid];
  if (i < m.moves.length) { m.moves[i] = mid; m.pp[i] = pp; } else { m.moves.push(mid); m.pp.push(pp); }
  m.learned ||= []; if (!m.learned.includes(mid)) m.learned.push(mid);
}
async function learnMove(m, mid, opts = {}) {
  const mv = D.moves.get(mid); if (m.moves.includes(mid)) return false;
  if (m.moves.length < 4) { setMoveAt(m, m.moves.length, mid); if (!opts.quiet) await info(`${esc(nameOf(m))} ha aprendido ${esc(moveName(mv))}`, `<div class="movechips">${moveChip(mid)}</div><p class="small muted">${esc(moveEffectText(mv).text)}</p>`); return true; }
  const pick = await choose(`${esc(nameOf(m))} quiere aprender ${esc(moveName(mv))}`, `<div class="movechips">${moveChip(mid)}</div><p class="small muted">${TYPE_ES[mv.type]} · ${mv.category === 'Status' ? 'Estado' : bp(mv) + ' de potencia'} · ${esc(moveEffectText(mv).text)}</p><p>¿Qué movimiento olvida?</p>`, [...m.moves.map((id, i) => ({ v: String(i), html: `${moveChip(id)}<span class="small muted">${D.moves.get(id).category === 'Status' ? 'Estado' : bp(D.moves.get(id)) + ' pot.'}</span>` })), { v: 'no', html: `<b>No aprender ${esc(moveName(mv))}</b>` }], true);
  if (pick == null || pick === 'no') { m.learned ||= []; if (!m.learned.includes(mid)) m.learned.push(mid); return false; }
  setMoveAt(m, +pick, mid); return true;
}

function monsFromCompact(t, lvl50, base = 0) { return t.map((x, i) => ({ uid: base + i, species: x.s, nick: x.k, level: lvl50 ? 50 : x.l, ability: x.a, moves: x.m, nature: x.n, ivs: x.i, gender: x.g, shiny: !!x.h, item: x.it || null, hp: null, status: '' })); }
function savedRun() { return S || loadSave(); }
function myTeam() { if (ON.pasted) return ON.pasted.t; const sv = savedRun(); if (sv && !sv.over && sv.party && sv.party.length) return compactTeam(sv.party); return null; }
function myName() { return (ON.name || (ON.pasted && ON.pasted.n) || savedRun()?.player?.name || 'Entrenador').slice(0, 14); }
function teamIcons(t) { return (t || []).map(x => icon(x.s)).join(''); }

ACT.online = async () => { closeModal(); ON.active = true; ON.view = 'lobby'; if (!ON.name) ON.name = (S && S.player?.name) || ''; render(); await net(); render(); };
ACT.onlineExit = () => { leaveRoom(); leaveTourney(); ON.active = false; B = null; render(); };
ACT.onlineLobby = () => { leaveRoom(); leaveTourney(); B = null; ON.view = 'lobby'; render(); };
ACT.pasteTeam = () => modal(`<div class="modal-head"><h2>Usar otro equipo</h2><button class="btn sm" data-a="closeModal">Volver</button></div><p class="muted small">Pega un código de equipo (RLKT.…). Lo sacas en Menú → Exportar mi equipo.</p><textarea id="ptcode" placeholder="RLKT.…"></textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn ghost" data-a="clearPasted">Usar mi partida</button><button class="btn primary" data-a="applyPasted">Usar este equipo</button></div>`);
ACT.applyPasted = () => { try { const d = validTeamCode(dec64($('#ptcode').value.trim().replace(/^RLKT\./, ''))); if (!Array.isArray(d.t) || !d.t.length) throw 0; ON.pasted = d; if (!ON.name) ON.name = d.n || ''; closeModal(); render(); } catch { toast('Ese código no es válido'); } };
ACT.clearPasted = () => { ON.pasted = null; closeModal(); render(); };
function readOnlineInputs() { const n = $('#on-name'); if (n) ON.name = n.value.trim().slice(0, 14); const l = $('#on-l50'); if (l) ON.lvl50 = l.checked; }

function renderOnline() {
  renderTop();
  if (ON.view === 'room' && B && B.o.kind === 'pvp') return; // battle screen owns #app
  if (!NET) { app().innerHTML = `<div class="loading"><div><div class="spin" style="margin:0 auto 12px"></div><h2>Conectando…</h2></div></div>`; return; }
  if (!NET.db) {
    app().innerHTML = `<section class="panel stack" style="max-width:640px;margin:0 auto"><span class="label">Combates online</span><h2>No se puede conectar desde aquí</h2><p>Abre el juego en el alojamiento con servidor de salas o en claude.ai con sesión iniciada.</p><p class="muted">Para alojarlo con tus amigos, usa tools/serve-online.cjs. También puedes exportar tu equipo a Pokémon Showdown o combatir contra la IA.</p><div class="row"><button class="btn" data-a="onlineExit">Volver</button></div></section>`;
    return;
  }
  if (ON.view === 'waiting') return renderWaiting();
  if (ON.view === 'tourney') return renderTourney();
  const team = myTeam();
  const ro = NET.canWrite === false;
  app().innerHTML = `<section class="stack online-shell" style="max-width:860px;margin:0 auto">
    <div class="row" style="justify-content:space-between"><div><span class="label">Combates online entre amigos</span><h1 style="margin:.15em 0">Salas y torneos</h1></div><button class="btn ghost" data-a="onlineExit">Volver</button></div>
    ${ro ? `<div class="panel" style="background:var(--red-soft);border:none;box-shadow:none"><b>Solo puedes mirar.</b> Para crear salas o combatir, el dueño de esta página tiene que darte acceso de Colaborador en Compartir.</div>` : ''}
    <div class="panel stack">
      <h3>Tu equipo</h3>
      ${team ? `<div class="row" style="gap:2px">${teamIcons(team)}</div><p class="small muted" style="margin:0">${ON.pasted ? 'Equipo pegado de un código.' : 'El equipo de tu partida actual.'} Los dos equipos empiezan curados. En línea nadie muere de verdad.</p>` : `<p class="muted">No tienes equipo. Empieza una partida o pega el código de un equipo.</p>`}
      <div class="row"><label class="row" style="gap:6px"><span class="small"><b>Tu nombre</b></span><input type="text" id="on-name" maxlength="14" value="${esc(ON.name || myName())}" style="width:150px"></label>
      <label class="row" style="gap:6px"><span class="sw"><input type="checkbox" id="on-l50" ${ON.lvl50 ? 'checked' : ''}><span></span></span><span class="small"><b>Nivel 50 para todos</b></span></label>
      <button class="btn sm ghost" data-a="pasteTeam">${ON.pasted ? 'Cambiar equipo' : 'Usar otro equipo'}</button></div>
    </div>
    <p class="small muted">${NET.mode==='server'?'Servidor de salas conectado. Cada jugador puede entrar desde su propio navegador.':NET.mode==='local'?'Prueba local: solo conecta pestañas de este navegador. Para jugar desde otros dispositivos, inicia el servidor de salas.':'Conexión de salas de Claude activa.'}</p>${NET.joinUrls?.length?'<div class="panel"><b>Enlace para amigos en tu red</b><p class="small muted">Abre este enlace en sus dispositivos y después comparte el código de sala.</p><div class="row"><input id="host-url" readonly value="'+esc(NET.joinUrls[0])+'"><button class="btn sm" data-a="copyArea" data-t="host-url">Copiar enlace</button></div></div>':''}${storedRoom()?'<button class="btn primary" data-a="roomResume">Reanudar sala '+esc(storedRoom())+'</button>':''}<div class="cfg-grid">
      <div class="panel stack"><h3>Combate 1 contra 1</h3><p class="small muted" style="margin:0">Crea una sala y pásale el código a tu amigo. Cada uno elige su movimiento en su navegador.</p>
        <button class="btn primary" data-a="roomCreate" ${team && !ro ? '' : 'disabled'}>Crear sala</button>
        <div class="row"><input type="text" id="on-room" placeholder="Código de sala" maxlength="12" style="width:150px;text-transform:uppercase"><button class="btn" data-a="roomJoin">Entrar</button></div>
        <p class="small muted" style="margin:0">Si entras en una sala llena, la verás como espectador.</p></div>
      <div class="panel stack"><h3>Torneo (liguilla)</h3><p class="small muted" style="margin:0">Todos contra todos. Cada victoria suma un punto; cada empate, medio punto. La clasificación se guarda.</p>
        <button class="btn primary" data-a="tCreate" ${team && !ro ? '' : 'disabled'}>Crear torneo</button>
        <div class="row"><input type="text" id="on-t" placeholder="Código de torneo" maxlength="12" style="width:150px;text-transform:uppercase"><button class="btn" data-a="tJoin">Entrar</button></div></div>
    </div>
  </section>`;
}
document.addEventListener('change', e => { if (e.target && (e.target.id === 'on-name' || e.target.id === 'on-l50')) readOnlineInputs(); });

// ---------- 1v1 rooms ----------
const roomRef = code => NET.db.doc('pvp/' + code);
function playerEntry() { return { id: NET.uid, name: myName(), team: myTeam() }; }
ACT.roomCreate = async () => {
  readOnlineInputs(); if (!myTeam()) return toast('Necesitas un equipo');
  const code = newCode(6);
  try { await roomRef(code).set({ v: 1, code, created: Date.now(), seed: randSeed(), lvl50: ON.lvl50, status: 'waiting', p1: playerEntry(), p2: null, ch: {}, forfeit: null, winner: null, tourney: null, mid: null }); }
  catch (e) { return toast(e && e.code === 'quota_exceeded' ? 'No caben más salas. Avisa al dueño de la página.' : 'No se pudo crear la sala'); }
  openRoom(code);
};
ACT.roomJoin = async () => {
  readOnlineInputs();
  const code = cleanCode($('#on-room')?.value); if (!code) return toast('Escribe el código de la sala');
  await joinRoomCode(code);
};
async function joinRoomCode(code) {
  let snap; try { snap = await roomRef(code).get(); } catch { return toast('No se pudo abrir la sala'); }
  if (!snap.exists) return toast('No existe ninguna sala con ese código');
  const d = snap.data();
  if (d.status === 'waiting' && !d.p2 && d.p1.id !== NET.uid && myTeam() && NET.canWrite !== false) {
    try { await roomRef(code).update({ p2: playerEntry(), status: 'playing' }); } catch { return toast('No se pudo entrar en la sala'); }
  }
  openRoom(code);
}
function storedRoom(){try{return cleanCode(sessionStorage.getItem('pokerandomoria-room')||'')}catch{return ''}}
ACT.roomResume=()=>{const code=storedRoom();if(code)openRoom(code);};
function leaveRoom() { try{sessionStorage.removeItem('pokerandomoria-room')}catch{} if (ON.roomUnsub) { ON.roomUnsub(); ON.roomUnsub = null; } ON.roomCode = null; ON.room = null; }
function openRoom(code) {
  leaveRoom(); try{sessionStorage.setItem('pokerandomoria-room',code)}catch{} ON.roomCode = code; ON.view = 'waiting'; render();
  ON.roomUnsub = roomRef(code).onSnapshot(s => onRoom(code, s), () => { toast('Se perdió la conexión con la sala'); });
}
function onRoom(code, snap) {
  if (ON.roomCode !== code) return;
  if (!snap.exists) { toast('La sala ya no existe'); ACT.onlineLobby(); return; }
  const d = snap.data(); ON.room = d;
  if (d.p1 && d.p2 && d.status !== 'waiting') {
    if (!B || B.o.kind !== 'pvp' || B.code !== code) startPvp(d); else pvpSync(d);
  } else if (ON.view === 'waiting') renderWaiting();
}
function renderWaiting() {
  const d = ON.room; const code = ON.roomCode;
  app().innerHTML = `<section class="panel stack" style="max-width:560px;margin:0 auto;text-align:center"><span class="label">Sala 1 contra 1</span><h2>Esperando rival</h2>
    <p>Pásale este código a tu amigo:</p><div style="font-family:var(--f-display);font-size:2.6rem;letter-spacing:.15em">${esc(code || '')}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-a="copyRoom">Copiar código</button></div>
    ${d ? `<p class="small muted">${esc(d.p1?.name || '')} · ${d.lvl50 ? 'Nivel 50' : 'Niveles de la partida'}</p><div class="row" style="justify-content:center;gap:2px">${teamIcons(d.p1?.team)}</div>` : '<p class="muted">Conectando…</p>'}
    <div class="row" style="justify-content:center"><button class="btn ghost" data-a="onlineLobby">Cancelar</button></div></section>`;
}
ACT.copyRoom = () => copyText(ON.roomCode || '');

function startPvp(d) {
  const side = d.p1.id === NET.uid ? 'p1' : d.p2.id === NET.uid ? 'p2' : null;
  const me = side || 'p1'; const foe = me === 'p1' ? 'p2' : 'p1';
  try{validTeamCode({t:d.p1.team});validTeamCode({t:d.p2.team})}catch{toast('La sala contiene un equipo inválido');ACT.onlineLobby();return;}
  const battle = new Battle({ formatid: 'gen9customgame', seed: d.seed });
  battle.setPlayer('p1', { name: d.p1.name, team: monsFromCompact(d.p1.team, d.lvl50, 1000).map(m => setFor(m, false)) });
  battle.setPlayer('p2', { name: d.p2.name, team: monsFromCompact(d.p2.team, d.lvl50, 2000).map(m => setFor(m, false)) });
  battle.makeChoices('team 1', 'team 1');
  ON.view = 'room';
  B = { battle, o: { kind: 'pvp', bb: 'Online', foeName: d[foe].name, meLabel: d[me].name, title: d.tourney ? `Torneo ${d.tourney} · sala ${d.code}` : `Sala ${d.code}`, onEnd: pvpLeave }, me, spectator: !side, myName: d[me].name, code: d.code, idx: 0, view: { p1: null, p2: null }, busy: false, ui: 'moves', ended: false, result: null, round: 0, room: d };
  renderBattle();
  fastForward = true; // replay what already happened quickly (reload, late joiner)
  pvpSync(d);
}
function needs(bt) { return ['p1', 'p2'].filter(s => bt[s].requestState && !bt[s].isChoiceDone()); }
function pvpSync(d) {
  if (!B || B.o.kind !== 'pvp') return;
  B.room = d; const bt = B.battle;
  let guard = 0;
  while (!bt.ended && guard++ < 1000) {
    const need = needs(bt); if (!need.length) break;
    const r = (d.ch || {})['r' + B.round];
    if (!r || need.some(s => typeof r[s] !== 'string')) break;
    for (const s of need) { if (!bt.choose(s, r[s])) { bt[s].choice.error = ''; bt.choose(s, 'default'); } }
    B.round++;
  }
  if (d.forfeit && !bt.ended) { try { bt.lose(d.forfeit); } catch { try { bt.win(d.forfeit === 'p1' ? 'p2' : 'p1'); } catch { } } }
  pvpPump();
}
function pvpPump() {
  if (!B) return;
  if (B.busy) { B.pumpAgain = true; return; }
  animate().then(() => { if (!B) return; if (B.pumpAgain) { B.pumpAgain = false; return pvpPump(); } pvpAfter(); });
}
function pvpSentThisRound() { const r = ((B.room && B.room.ch) || {})['r' + B.round]; return !!(r && r[B.me]) || B.pending === B.round; }
async function pvpSend(choice) {
  if (!B || B.spectator || B.busy || pvpSentThisRound()) return;
  const round = B.round; B.pending = round; renderControls();
  try { await roomRef(B.code).update({ ch: { ['r' + round]: { [B.me]: choice } } }); }
  catch { B.pending = null; toast('No se pudo enviar. Inténtalo otra vez.'); renderControls(); }
}
async function pvpForfeit() {
  if (!B || B.spectator) return;
  const ok = await choose('¿Rendirte?', '<p>Perderás este combate.</p>', [{ v: 'yes', html: '<b>Sí, me rindo</b>' }, { v: 'no', html: '<b>Seguir combatiendo</b>' }], true);
  if (ok !== 'yes' || !B) return;
  try { await roomRef(B.code).update({ forfeit: B.me }); } catch { toast('No se pudo enviar'); }
}
function pvpAfter() {
  const bt = B.battle;
  if (!bt.ended) { renderControls(); return; }
  if (B.ended) return;
  const winSide = winnerSide(bt, B.room && B.room.forfeit);
  // record the result once (both players write the same value)
  const d = B.room;
  if (!B.spectator && d.status !== 'done') {
    roomRef(B.code).update({ status: 'done', winner: winSide }).catch(() => { });
    if (d.tourney && d.mid) NET.db.doc('torneos/' + d.tourney).update({ matches: { [d.mid]: { winner: winSide?d[winSide].id:null, draw:!winSide } } }).catch(() => { });
  }
  endBattle({ won: winSide === B.me, draw:!winSide });
  if (d.forfeit) pushLog(`${d[d.forfeit].name} se ha rendido.`);
}
function pvpLeave(res) {
  const tcode = ON.room && ON.room.tourney;
  leaveRoom(); B = null;
  if (tcode) { ON.view = 'tourney'; openTourney(tcode); } else { ON.view = 'lobby'; render(); }
}

// ---------- Tournaments (round robin) ----------
const tRef = code => NET.db.doc('torneos/' + code);
ACT.tCreate = async () => {
  readOnlineInputs(); if (!myTeam()) return toast('Necesitas un equipo');
  const code = 'T' + newCode(4);
  try { await tRef(code).set({ v: 1, code, host: NET.uid, created: Date.now(), lvl50: ON.lvl50, status: 'open', players: { [NET.uid]: { name: myName(), team: myTeam(), at: Date.now() } }, matches: {} }); }
  catch { return toast('No se pudo crear el torneo'); }
  openTourney(code);
};
ACT.tJoin = async () => {
  readOnlineInputs();
  const code = cleanCode($('#on-t')?.value); if (!code) return toast('Escribe el código del torneo');
  let snap; try { snap = await tRef(code).get(); } catch { return toast('No se pudo abrir el torneo'); }
  if (!snap.exists) return toast('No existe ningún torneo con ese código');
  const d = snap.data();
  if (d.status === 'open' && !(d.players || {})[NET.uid] && myTeam() && NET.canWrite !== false) {
    try { await tRef(code).update({ players: { [NET.uid]: { name: myName(), team: myTeam(), at: Date.now() } } }); } catch { return toast('No se pudo entrar en el torneo'); }
  }
  openTourney(code);
};
function leaveTourney() { if (ON.tUnsub) { ON.tUnsub(); ON.tUnsub = null; } ON.tCode = null; ON.tourney = null; }
function openTourney(code) {
  leaveTourney(); ON.tCode = code; ON.view = 'tourney'; render();
  ON.tUnsub = tRef(code).onSnapshot(s => { if (ON.tCode !== code) return; if (!s.exists) { toast('El torneo ya no existe'); return ACT.onlineLobby(); } ON.tourney = s.data(); if (ON.view === 'tourney' && !B) renderTourney(); }, () => toast('Se perdió la conexión con el torneo'));
}
function standings(t) {
  const ps = Object.entries(t.players || {}).map(([id, p]) => ({ id, name: p.name, team: p.team, w: 0, l: 0, d:0, points:0, at: p.at || 0 }));
  const by = Object.fromEntries(ps.map(p => [p.id, p]));
  for (const m of Object.values(t.matches || {})) if(m.draw){for(const id of [m.a,m.b])if(by[id]){by[id].d++;by[id].points+=.5;}}else if (m.winner) { const loser = m.winner === m.a ? m.b : m.a; if (by[m.winner]) {by[m.winner].w++;by[m.winner].points++;} if (by[loser]) by[loser].l++; }
  return ps.sort((x, y) => y.points - x.points || y.w - x.w || x.at - y.at);
}
function renderTourney() {
  const t = ON.tourney; const code = ON.tCode;
  if (!t) { app().innerHTML = `<div class="loading"><div><div class="spin" style="margin:0 auto 12px"></div><h2>Cargando torneo…</h2></div></div>`; return; }
  const isHost = t.host === NET.uid; const me = NET.uid;
  const table = standings(t);
  const matches = Object.entries(t.matches || {}).sort((a, b) => +a[0].slice(1) - +b[0].slice(1));
  const done = matches.filter(([, m]) => m.winner||m.draw).length;
  const finished = t.status === 'running' && matches.length && done === matches.length;
  const nm = id => esc((t.players[id] || {}).name || '¿?');
  app().innerHTML = `<section class="stack online-shell" style="max-width:860px;margin:0 auto">
    <div class="row" style="justify-content:space-between"><div><span class="label">Torneo · liguilla · ${t.lvl50 ? 'Nivel 50' : 'niveles de la partida'}</span><h1 style="margin:.15em 0">Código ${esc(code)}</h1></div><div class="row"><button class="btn sm" data-a="copyT">Copiar código</button><button class="btn sm ghost" data-a="onlineLobby">Salir</button></div></div>
    ${finished ? `<div class="panel" style="background:var(--grass-soft);border:none;box-shadow:none;text-align:center"><span class="label">Liguilla finalizada</span><h2>${table.filter(p=>p.points===table[0].points).map(p=>esc(p.name)).join(' / ')}</h2><p class="small muted" style="margin:0">${table[0]?.points || 0} puntos</p></div>` : ''}
    <div class="panel"><h3>Clasificación</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin-top:8px" class="num">
      <thead><tr class="label" style="text-align:left"><th style="padding:4px">#</th><th>Entrenador</th><th>Equipo</th><th style="text-align:right">V</th><th style="text-align:right">E</th><th style="text-align:right">D</th><th style="text-align:right;padding-right:4px">Pts</th></tr></thead>
      <tbody>${table.map((p, i) => `<tr style="border-top:1px solid var(--line)${p.id === me ? ';font-weight:700' : ''}"><td style="padding:6px 4px">${i + 1}</td><td>${esc(p.name)}${p.id === me ? ' (tú)' : ''}${p.id === t.host ? ' <span class="chip">organiza</span>' : ''}</td><td><span class="row" style="gap:0;flex-wrap:nowrap">${teamIcons(p.team)}</span></td><td style="text-align:right">${p.w}</td><td style="text-align:right">${p.d}</td><td style="text-align:right">${p.l}</td><td style="text-align:right;padding-right:4px">${p.points}</td></tr>`).join('')}</tbody></table></div></div>
    ${t.status === 'open' ? `<div class="panel stack"><h3>Inscripción abierta</h3><p class="small muted" style="margin:0">Pasa el código <b>${esc(code)}</b> a tus amigos. ${isHost ? 'Cuando estéis todos, empieza el torneo.' : 'Esperando a que el organizador empiece.'}</p>${isHost ? `<button class="btn primary" data-a="tStart" ${table.length >= 2 ? '' : 'disabled'}>Empezar torneo (${table.length} jugadores)</button>` : ''}</div>` : ''}
    ${matches.length ? `<div class="panel"><h3>Combates · ${done}/${matches.length} jugados</h3><div class="stack" style="gap:6px;margin-top:8px">${matches.map(([id, m]) => { const mine = m.a === me || m.b === me; return `<div class="step ${(m.winner||m.draw) ? 'done' : ''}"><span class="tick">${(m.winner||m.draw) ? '✓' : ''}</span><div class="t"><b>${nm(m.a)}</b> contra <b>${nm(m.b)}</b>${m.draw?'<div class="small muted">Empate · ½ punto para cada uno</div>':m.winner ? `<div class="small muted">Gana ${nm(m.winner)}</div>` : ''}</div>${(m.winner||m.draw) ? `<button class="btn sm ghost" data-a="tOpen" data-room="${esc(m.room)}">Ver</button>` : `<button class="btn sm ${mine ? 'primary' : 'ghost'}" data-a="tOpen" data-room="${esc(m.room)}">${mine ? 'Jugar' : 'Mirar'}</button>`}</div>`; }).join('')}</div></div>` : ''}
  </section>`;
}
ACT.copyT = () => copyText(ON.tCode || '');
ACT.tStart = async () => {
  const t = ON.tourney; if (!t || t.host !== NET.uid || t.status !== 'open') return;
  const ids = Object.entries(t.players).sort((a, b) => (a[1].at || 0) - (b[1].at || 0)).map(([id]) => id);
  if (ids.length < 2) return;
  const matches = {}; let k = 0;
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
    const mid = 'm' + k; const room = `${t.code}-M${k}`; k++;
    const a = ids[i], b = ids[j];
    matches[mid] = { a, b, room, winner: null };
    try { await roomRef(room).set({ v: 1, code: room, created: Date.now(), seed: randSeed(), lvl50: t.lvl50, status: 'playing', p1: { id: a, name: t.players[a].name, team: t.players[a].team }, p2: { id: b, name: t.players[b].name, team: t.players[b].team }, ch: {}, forfeit: null, winner: null, tourney: t.code, mid }); }
    catch { return toast('No se pudieron crear los combates'); }
  }
  try { await tRef(t.code).update({ status: 'running', matches }); } catch { toast('No se pudo empezar el torneo'); }
};
ACT.tOpen = d => { const room = d.room; leaveTourney(); openRoom(room); };

// ================= BOOT =================
await loadAssets();
render();

</script>
